{% if announcement.title_image %}
  <img src="{{ announcement.title_image.url }}" alt="">
{% endif %}
<div>
  <h1>
    {{ announcement.title }}
  </h1>
  <p>
    {{ announcement.content }}
  </p>
  <p>
    <a href="{% url 'delete-announcement' announcement.pk %}">Delete</a>
    <a href="{% url 'edit-announcement' announcement.pk %}">Edit</a>
  </p>
</div>
