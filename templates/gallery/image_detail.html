{% extends 'base.html' %}
{% block content %}
<div class="main-img-container text-center mb-3 bg-light rounded-3 overflow-hidden d-flex align-items-center justify-content-center" style="height: 380px;">
  <img class="img-fluid h-100 object-fit-contain" src="{{ image.image.url }}">
</div>
<form method="post">
  {% csrf_token %}
  <select name="product_id" class="form-select">
    {% for product in products %}
      <option value="{{ product.id }}">{{ product.title }}</option>
    {% endfor %}
  </select>
  <div class="text-center">
    <button type="submit" class="btn btn-success btn-lg mt-2">Add to product</button>
  </div>
</form>
{% endblock %}
