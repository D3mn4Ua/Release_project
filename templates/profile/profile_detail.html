{% extends 'base.html' %}
{% block content %}
<div class="card border-0 shadow-sm p-4 rounded-4" style="max-width: 500px; margin: 0 auto;">
    <div class="d-flex align-items-center gap-3 mb-3">
        <div class="text-white rounded-circle d-flex align-items-center justify-content-center fw-bold overflow-hidden shadow-sm" style="width: 45px; height: 45px;">
          <img src="{{ profile.avatar.url }}" class="w-100 h-100 object-fit-cover">
        </div>
        
        <div>
            <h3 class="fw-bold mb-1">{{ profile.user.username }}</h3>
            <p class="text-muted small mb-0">
                Role: <span class="badge bg-success-subtle text-success px-2 py-1">{{ profile.role|title }}</span>
            </p>
        </div>
    </div>

    {% if request.user == profile.user %}
        <div class="mt-3 pt-3 border-top">
            <a href="{% url 'edit-profile' profile.pk %}" class="btn btn-outline-success w-100 rounded-pill fw-semibold">
                <i class="bi bi-pencil-square me-1"></i> Edit Profile
            </a>
        </div>
    {% endif %}
</div>
{% endblock %}
