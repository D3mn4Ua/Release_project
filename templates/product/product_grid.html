<div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-4">
    {% for p in page_obj %}
        <div class="col">
            <div class="card h-100 product-card shadow-sm border-0 position-relative">
              <div class="product-img-wrapper text-center p-3">
                  {% with first_img=p.product_image.first %}
                      {% if first_img and first_img.image %}
                          <img src="{{ first_img.image.url }}" class="card-img-top img-fluid rounded" alt="{{ p.title }}">
                      {% else %}
                          <div class="no-image-placeholder d-flex align-items-center justify-content-center rounded bg-light text-muted w-100 h-100">
                              <i class="bi bi-image fs-1"></i>
                          </div>
                      {% endif %}
                  {% endwith %}
                </div>
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title text-truncate fw-semibold" title="{{ p.title }}">{{ p.title }}</h5>
                    <p class="card-text text-muted small text-truncate-2 mb-3">{{ p.description }}</p>
                    <div class="mt-auto d-flex align-items-center justify-content-between">
                        <span class="fs-5 fw-bold text-success">${{ p.price|default:"--" }}</span>
                        <a href="{% url 'product-detail' p.pk %}" class="btn btn-outline-success btn-sm rounded-pill px-3">
                            Details
                        </a>
                    </div>
                </div>
            </div>
        </div>
    {% empty %}
        <div class="col-12 text-center py-5">
            <i class="bi bi-search fs-1 text-muted mb-3 d-block"></i>
            <h5 class="text-muted">No products found</h5>
        </div>
    {% endfor %}
</div>
